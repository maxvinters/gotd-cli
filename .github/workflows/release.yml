name: goreleaser

on:
  push:
    tags:
      - 'v*'

# Least privilege: goreleaser only needs to create the release / upload assets.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          # setup-go caches the module and build caches by default (keyed on
          # go.sum), so the manual cache + set-output steps are no longer needed.

      - name: Verify release secrets
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          missing=
          [ -n "$APP_ID" ] || missing="$missing APP_ID"
          [ -n "$APP_HASH" ] || missing="$missing APP_HASH"
          if [ -n "$missing" ]; then
            echo "::error::Missing required release secret(s):$missing. Set them with: gh secret set <NAME>"
            exit 1
          fi
          echo "Release credentials present (APP_ID=${#APP_ID} chars, APP_HASH=${#APP_HASH} chars)."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Built-in app credentials injected into the binaries via -ldflags.
          # Required: the "Verify release secrets" step above fails the build if
          # these are not set, so releases never silently ship the public
          # tdesktop fallback.
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Upload assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli
          path: dist/*
